services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: hackathon-postech-fiap-worker-app
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3001}
      # AWS / SQS / S3 / Core API — repassados do .env para o container.
      # Dentro da rede compartilhada os hosts são "localstack" (AWS emulado) e
      # "hackathon-postech-fiap-core-app" (core); estes valores sobrescrevem o .env.
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_ENDPOINT=http://localstack:4566
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/video-processing
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - API_URL=http://hackathon-postech-fiap-core-app:3000
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    networks:
      - worker-network
      - core-network
    restart: unless-stopped

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: hackathon-postech-fiap-worker-test
    env_file:
      - .env
    environment:
      - NODE_ENV=test
    networks:
      - worker-network
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

networks:
  worker-network:
    driver: bridge
  # Rede externa do core — o compose do core precisa estar de pé ANTES do worker,
  # caso contrário o docker retorna "network not found".
  core-network:
    external: true
    name: hackathon-postech-fiap-core_postgres
