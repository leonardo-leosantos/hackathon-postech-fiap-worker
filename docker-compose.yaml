services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: hackathon-postech-fiap-worker-app
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--require dd-trace/init
      - PORT=${PORT:-3001}
      # AWS / SQS / S3 / Core API — repassados do .env para o container.
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - SQS_QUEUE_URL=${SQS_QUEUE_URL}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - API_URL=${API_URL}
      - DD_ENV=production
      - DD_SERVICE=hackathon-postech-fiap-worker
      - DD_VERSION=1.0.0
      - DD_AGENT_HOST=datadog-agent
      - DD_TRACE_AGENT_PORT=8126
      - DD_PROFILING_ENABLED=true
      - DD_LOGS_INJECTION=true
      - DD_APPSEC_ENABLED=true
      - DD_APPSEC_SCA_ENABLED=true
    labels:
      com.datadoghq.tags.env: 'production'
      com.datadoghq.tags.service: 'hackathon-postech-fiap-worker'
      com.datadoghq.tags.version: '1.0.0'
    networks:
      - worker-network
    restart: unless-stopped

  # Coleta métricas do host e dos containers e recebe traces APM (DD_APM_NON_LOCAL_TRAFFIC permite outros containers na rede enviarem traces).
  datadog-agent:
    image: datadog/agent:latest
    container_name: hackathon-postech-fiap-worker-datadog-agent
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_APM_ENABLED: 'true'
      DD_APM_NON_LOCAL_TRAFFIC: 'true'
      DD_SITE: datadoghq.com
    networks:
      worker-network:
        aliases:
          - datadog-agent

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: hackathon-postech-fiap-worker-test
    env_file:
      - .env
    environment:
      - NODE_ENV=test
    networks:
      - worker-network
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  sonarqube:
    image: sonarqube:lts-community
    container_name: hackathon-postech-fiap-worker-sonarqube
    ports:
      - '9004:9000'
    environment:
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube-db:5432/sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      sonarqube-db:
        condition: service_healthy
    networks:
      - worker-network

  sonarqube-db:
    image: postgres:16-alpine
    container_name: hackathon-postech-fiap-worker-sonarqube-db
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    ports:
      - '5436:5432'
    networks:
      - worker-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sonar']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  worker-network:
    driver: bridge

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db:
